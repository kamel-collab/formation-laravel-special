name: formation-laravel

services:
  app:
    build: .
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      db:
        condition: service_healthy
    # Permet d'entrer dans le conteneur pour installer Composer au premier lancement.
    command: >-
      sh -c 'while [ ! -f vendor/autoload.php ]; do
      echo "En attente de composer install..."; sleep 3; done;
      exec php artisan serve --host=0.0.0.0 --port=8080'

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: formation_documents
      POSTGRES_USER: formation
      POSTGRES_PASSWORD: formation_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formation -d formation_documents"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    environment:
      PGADMIN_DEFAULT_EMAIL: formation@example.com
      PGADMIN_DEFAULT_PASSWORD: formation_local
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  composer_vendor:
  pgadmin_data:
